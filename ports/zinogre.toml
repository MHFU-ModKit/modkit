[[rule]]
play = "lunge_stop"
from = "lunge"
min_frames = 75
cooldown = 30
label = "run budget by time"

[[rule]]
play = "stamp"
from = "lunge_stop"
min_frames = 20
dist = [
    0.0,
    1200.0,
]
cooldown = 150
label = "the hunter close once the skid has stood -> stamp"

