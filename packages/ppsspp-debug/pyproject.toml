[project]
name = "ppsspp-debug"
version = "0.1.0"
description = "A typed client for PPSSPP's WebSocket debugger, blocking and asyncio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["websockets>=15", "psutil>=6"]
classifiers = ["Typing :: Typed"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
