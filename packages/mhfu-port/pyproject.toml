[project]
name = "mhfu-port"
version = "0.1.0"
description = "Port Monster Hunter Portable 3rd monsters into Monster Hunter Freedom Unite."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["mhp-formats", "mhfu", "numpy>=1.24", "tomli-w>=1.2"]
classifiers = ["Typing :: Typed"]

[project.scripts]
mhfu-port = "mhfu_port.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
