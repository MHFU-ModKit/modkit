[project]
name = "mhp-formats"
version = "0.1.0"
description = "Monster Hunter Portable (PSP) file formats: archives, models, textures, skeletons, animations, stages."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["construct>=2.10.70", "construct-typing>=0.8"]
classifiers = ["Typing :: Typed"]

[project.optional-dependencies]
# mhef is not on PyPI, and upstream (archived) no longer runs on Python 3; the fork does
iso = [
    "pycdlib>=1.14",
    "mhef @ git+https://github.com/MHFU-ModKit/mhef@0d0ba4802d4dfcf4f4960a8ebb7c69a8bf48780f",
]

[project.scripts]
mhp-formats = "mhp_formats.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
