CURSOR = { offset = 0x24, type = "u8", doc = "selected row, 0-based" }
ROW_COUNT = { offset = 0x27, type = "u8", doc = "number of rows in this menu" }

[struct.RESOURCE_SLOT]
doc = "one slot of the resident-file table RESOURCE_TABLE points at"
size = 0x0C
[struct.RESOURCE_SLOT.fields]
FLAGS = { offset = 0x00, type = "u16", doc = "0x0002 = loaded" }
