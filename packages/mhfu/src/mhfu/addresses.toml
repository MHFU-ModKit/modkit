# MHFU runtime addresses and struct layouts, EU release (ULES01213).
#
# The single source for every game address the modkit uses. Python reads this file; the C header
# and the Lua table are generated from it with `python -m mhfu.addresses c` / `lua`.
#
#   [address]
#   NAME = { eu = <absolute address>, type = "<type>", doc = "<one line>" }
#
#   [struct.NAME]
#   doc = "<one line>"
#   size = <bytes>                      # optional, only when known
#   [struct.NAME.fields]
#   NAME = { offset = <offset>, type = "<type>", doc = "<one line>" }
#
# Types: u8 u16 u32 s8 s16 s32 f32 vec3 ptr vtable fn code bytes, each optionally followed by
# [count] for an array. fn is a function entry, code any other instruction address.
# Names are UPPER_SNAKE_CASE; an address and a value appear once.

[address]
# --- screens and areas ---
SCENE_OBJECT = { eu = 0x08A8C6E0, type = "ptr", doc = "scene-object pointer; tells sub-screens apart where SCREEN_STATE is shared (the real screen oracle)" }
SCREEN_STATE = { eu = 0x08A8CA48, type = "u8", doc = "screen-state id: 1 menu or zone load, 4 title, 6 cutscene, 17 in-area; 1 and 4 are the JIT-cold window" }
MAP_SUBSECTION = { eu = 0x08A8DE4C, type = "u8", doc = "sub-area byte; collides across sections and is scratch in the hall, so use AREA_INDEX" }
SCREEN_STATE_MIRROR = { eu = 0x08ACCA48, type = "u8", doc = "mirror of SCREEN_STATE (+0x40000), lags it by 50-100 ms" }
MAP_SUBSECTION_MIRROR = { eu = 0x08ACDE4C, type = "u8", doc = "mirror of MAP_SUBSECTION (+0x40000)" }
AREA_INDEX = { eu = 0x08B0C7DC, type = "u16", doc = "visible map-section index, equal to the stage number; ENTITY.SECTION uses the same encoding" }

