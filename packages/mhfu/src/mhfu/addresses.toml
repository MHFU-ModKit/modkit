RANGE_PARAMS = { offset = 0x20, type = "f32[12]", doc = "range parameters" }
SCALARS = { offset = 0x60, type = "f32[4]", doc = "four scalar parameters" }
ATTACK_PATTERNS = { offset = 0x70, type = "ptr", doc = "attack pattern and hit-volume records" }
SIGHT_RADIUS = { offset = 0x80, type = "f32", doc = "detection radius, read on evaluate; 0.0 stops new aggro" }
HURTBOX_SET = { offset = 0x240, type = "ptr", doc = "the HIT_VOLUME set this species walks as its hurtboxes" }
HITZONE_STATES = { offset = 0x2FC, type = "ptr", doc = "pointer table of hitzone grids (0x48: 7 rows x 10 percent bytes) picked by HITZONE_STATE" }

[struct.HIT_VOLUME]
doc = "one collision sphere or capsule record; a set ends at BONE == 0xFFFF"
size = 0x28
[struct.HIT_VOLUME.fields]
BONE = { offset = 0x00, type = "u16", doc = "joint index; 0x7D..0x7F are markers, not joints" }
SHAPE = { offset = 0x02, type = "u16", doc = "0 sphere, 1 capsule" }
HITZONE_ROW = { offset = 0x04, type = "u16", doc = "row 0..6 of the hitzone grid" }
PART = { offset = 0x06, type = "u16", doc = "damage part 0..7, the ENTITY.PENDING_DAMAGE index" }
FLAGS = { offset = 0x08, type = "u32", doc = "record flags the walkers gate on" }
RADIUS = { offset = 0x0C, type = "f32", doc = "radius" }
OFFSET_A = { offset = 0x10, type = "vec3", doc = "bone-relative offset" }
OFFSET_B = { offset = 0x1C, type = "vec3", doc = "capsule far end" }

[struct.ATTACK_RECORD]
doc = "one attack record in a species overlay's attack table"
size = 0x18
[struct.ATTACK_RECORD.fields]
LEAD = { offset = 0x00, type = "u8", doc = "0 in every record; a nonzero value ends the table" }
UNKNOWN_01 = { offset = 0x01, type = "u8", doc = "measured not to change the damage; meaning unknown" }
POWER = { offset = 0x02, type = "u8", doc = "attack power; measured, the damage follows it" }
KIND = { offset = 0x03, type = "u8", doc = "small enum (1, 2, 3, 0x1D); a label from its shape only" }
FAMILY = { offset = 0x05, type = "u8", doc = "0x00 or 0x10, splits the records in two; a label from its shape only" }
ANGLE = { offset = 0x06, type = "u8", doc = "0..255; an angle, inferred from its range" }
TAG = { offset = 0x08, type = "u8", doc = "0x0A, 0x0F, 0x27, 0x28 or 0x32; a label from its shape only" }
ELEMENT = { offset = 0x09, type = "u8", doc = "element gate bits the player-damage resolver picks a resistance by; measured" }
VOLUME_SET = { offset = 0x0A, type = "u8", doc = "index into the overlay's HIT_VOLUME set pointer table; measured" }
HALF_0C = { offset = 0x0C, type = "u16", doc = "the only 16-bit field (the copy uses lhu); meaning unknown" }
VALUE_14 = { offset = 0x14, type = "u32", doc = "2, 10, 20, 25 or 30; a label from its shape only" }

[struct.CLI_BRIDGE]
doc = "framework-owned command block at CLI_BRIDGE_BLOCK: the debug CLI writes it, cli_bridge.lua polls it"
[struct.CLI_BRIDGE.fields]
MAGIC = { offset = 0x00, type = "u32", doc = "0x4D484252 (MHBR) once the CLI has written a command" }
SEQ = { offset = 0x04, type = "u32", doc = "command sequence number; a new value means a new command" }
CMD = { offset = 0x08, type = "u32", doc = "1 force action, 2 freeze AI, 3 clear" }
SLOT = { offset = 0x0C, type = "u32", doc = "ENTITY_REGISTRY slot of the target monster" }
ARG = { offset = 0x10, type = "u32", doc = "action id, or on/off for freeze" }
ARG2 = { offset = 0x14, type = "u32", doc = "spare argument; cli_bridge.lua ignores it" }
ACK = { offset = 0x18, type = "u32", doc = "SEQ the game has applied" }
STATUS = { offset = 0x1C, type = "u32", doc = "action id currently held" }
PROBE = { offset = 0x20, type = "u32", doc = "CLI scratch word used to test that the block is mapped" }

[struct.MAP_ROW]
doc = "one row of MAP_TABLE: the stages of one map"
size = 0x08
[struct.MAP_ROW.fields]
COUNT = { offset = 0x00, type = "u32", doc = "number of stages; 0 for an unused row" }
STAGES = { offset = 0x04, type = "ptr", doc = "u16 stage numbers, the entry area (base camp) first" }

[struct.MAP_MANAGER]
doc = "map manager MAP_MANAGER_PTR points at"
[struct.MAP_MANAGER.fields]
ROW = { offset = 0x284, type = "u32", doc = "the session's map row, a MAP_TABLE index" }
STAGE = { offset = 0x288, type = "u16", doc = "the stage on screen; also names the village, where AREA_INDEX reads 0" }

[struct.STAGE_PARAMS]
doc = "parameter object of a stage overlay, returned by a constant getter in its code"
[struct.STAGE_PARAMS.fields]
SURFACES = { offset = 0x0C, type = "ptr", doc = "u32 surface-property masks, indexed by a collision triangle's surface id (0..7)" }
SPHERES = { offset = 0x10, type = "ptr", doc = "STAGE_SPHERE records, SPHERE_COUNT of them" }
SLOTS = { offset = 0x14, type = "u16[10]", doc = "small slot ids below 0x40, padded with 0xFFFF" }
EXITS = { offset = 0x30, type = "ptr", doc = "STAGE_EXIT records, EXIT_COUNT of them" }
OBJECTS_A = { offset = 0x34, type = "ptr", doc = "32-byte placed-object records, OBJECT_A_COUNT of them; not decoded" }
OBJECTS_B = { offset = 0x38, type = "ptr", doc = "32-byte placed-object records, OBJECT_B_COUNT of them; not decoded" }
ENV = { offset = 0x3C, type = "u8", doc = "per-map enum (0 on most maps, 3 or 4 on the snowy bank); what it selects is not pinned" }
EXIT_COUNT = { offset = 0x3D, type = "u8", doc = "number of EXITS records" }
SPHERE_COUNT = { offset = 0x3E, type = "u8", doc = "number of SPHERES records" }
OBJECT_A_COUNT = { offset = 0x3F, type = "u8", doc = "number of OBJECTS_A records" }
OBJECT_B_COUNT = { offset = 0x40, type = "u8", doc = "number of OBJECTS_B records" }
WALL_CLASSES = { offset = 0x00, type = "u32[3]", doc = "wall class per surface id: the wall resolver reads byte 0 of P + 4 * surface id; bit 2 is the wall a Tigrex sticks to" }

[struct.STAGE_EXIT]
doc = "one area transition of a stage: a trigger cylinder here and a landing point in the target stage"
size = 0x34
[struct.STAGE_EXIT.fields]
TARGET = { offset = 0x00, type = "u16", doc = "the stage it leads to" }
FLAG = { offset = 0x02, type = "u16", doc = "1 on a few exits, else 0; meaning unknown" }
TRIGGER = { offset = 0x04, type = "vec3", doc = "base of the trigger cylinder the hunter walks into" }
RADIUS = { offset = 0x10, type = "f32", doc = "trigger radius" }
HEIGHT = { offset = 0x14, type = "f32", doc = "trigger height" }
DEST = { offset = 0x24, type = "vec3", doc = "where the hunter lands in the target stage" }
YAW = { offset = 0x30, type = "u16", doc = "facing on landing, 0x10000 = one turn" }
END = { offset = 0x18, type = "vec3", doc = "with FLAG 1 the trigger is a capsule from TRIGGER to here, RADIUS wide; FLAG 0 is the cylinder" }

[struct.STAGE_SPHERE]
doc = "one sphere of a stage overlay's sphere list; what it marks is not decoded"
size = 0x18
[struct.STAGE_SPHERE.fields]
ID = { offset = 0x02, type = "u16", doc = "sphere id" }
POSITION = { offset = 0x04, type = "vec3", doc = "centre, world space" }
RADIUS = { offset = 0x10, type = "f32", doc = "radius" }
TAIL = { offset = 0x14, type = "u32", doc = "trailing word; meaning unknown" }

[struct.GATHER_SPOT]
doc = "one per-quest heap record of the gathering-spot table: groups of four spots, each group ended by a record with x = -1.0"
size = 0x18
[struct.GATHER_SPOT.fields]
POSITION = { offset = 0x00, type = "vec3", doc = "world position; all zero in an unused slot" }
RADIUS = { offset = 0x0C, type = "f32", doc = "radius; not the interaction range, which is wider" }
ID = { offset = 0x10, type = "u16", doc = "spot id; id / 4 indexes the map row's areas without the base camp" }
USES = { offset = 0x12, type = "u16", doc = "gathers left, 4..10 at quest start; only the hunter's gathers count down" }
TOOL = { offset = 0x14, type = "u16", doc = "required tool: 0 none, 3 pickaxe, 4 bug net" }
USES_M = { offset = 0x16, type = "u16", doc = "second counter, 1..8 at quest start; 0 with USES when the spot is exhausted" }

[struct.SMALL_SPAWN]
doc = "one per-quest heap record of the small-monster spawn table, rebuilt per area as the hunter enters it"
size = 0x3C
[struct.SMALL_SPAWN.fields]
SEED = { offset = 0x00, type = "u32", doc = "nonzero per-record value; meaning unknown" }
POSITION = { offset = 0x04, type = "vec3", doc = "the fixed spawn point, not where the monster is now" }
INDEX = { offset = 0x10, type = "u16", doc = "running counter across the quest" }
KIND = { offset = 0x12, type = "u16", doc = "always 2" }
MARK = { offset = 0x14, type = "u16", doc = "always 100" }
HP = { offset = 0x16, type = "u16", doc = "the live monster's HP; 0xFFFF outside the hunter's area" }
ENTITY = { offset = 0x18, type = "u16", doc = "ENTITY_REGISTRY slot of the live monster minus one; 0xFF outside the hunter's area" }

[struct.HITZONE_GRID]
doc = "one hitzone grid a SPECIES.HITZONE_STATES entry points at: damage percentages by hitzone row and damage type"
size = 0x48
[struct.HITZONE_GRID.fields]
PERCENT = { offset = 0x00, type = "u8[70]", doc = "7 rows (HIT_VOLUME.HITZONE_ROW) of 10 damage-type columns" }
PAD = { offset = 0x46, type = "u8[2]", doc = "zero in every grid" }

[struct.ATTACK_NODE]
doc = "live attack node the spawner allocates; ATTACK_TABLE_SETTER fills it from the attack table"
size = 0xE0
[struct.ATTACK_NODE.fields]
ATTACK_ID = { offset = 0x0D, type = "u8", doc = "attack id, offset per entity species where one table serves several" }
OWNER = { offset = 0x10, type = "ptr", doc = "the attacking entity" }
RECORD = { offset = 0x1C, type = "bytes", doc = "verbatim copy of the ATTACK_RECORD" }
VOLUME_SET = { offset = 0x34, type = "ptr", doc = "the HIT_VOLUME set the record's VOLUME_SET selects; the overlay stores it right after the setter call" }
POSITION = { offset = 0x40, type = "vec3", doc = "the node's own position; bones 126 and 127 test against it" }

[struct.CAM_ORBIT]
doc = "the quest orbit camera CAM_ORBIT_UPDATE works on; CAM_EYE and CAM_PIVOT are its EYE and PIVOT"
[struct.CAM_ORBIT.fields]
EYE = { offset = 0x40, type = "vec3", doc = "eye; CAM_EYE_Y_STORE writes its y" }
PIVOT = { offset = 0x50, type = "vec3", doc = "pivot the eye orbits, copied from the followed object each frame" }

[struct.CAM_ORBIT_FRAME]
doc = "CAM_ORBIT_UPDATE's stack frame at CAM_ORBIT_INPUTS"
[struct.CAM_ORBIT_FRAME.fields]
ANGLES = { offset = 0x17C, type = "f32[3]", doc = "orbit euler angles in radians, derived before the rotation is built" }

[struct.HUNTER]
doc = "the player combat entity PLAYER_ENTITY beyond the ENTITY fields it shares"
[struct.HUNTER.fields]
EXITING = { offset = 0x2A4, type = "u8", doc = "1 while leaving through an exit; without it an area change loads the stage and leaves the hunter frozen where he stood" }
