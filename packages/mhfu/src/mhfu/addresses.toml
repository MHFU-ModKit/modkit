EM75_STUCK = { eu = 0x09D26940, type = "fn", doc = "em75 (0,6), head stuck in a wall: executor a1 20 with ACTION_BUDGET 180, then a1 21 (pull out) until the clip ends, then (0,1)" }
MONSTER_AI_STEP_CALL = { eu = 0x09AC6638, type = "code", doc = "MONSTER_STEP loading the species AI step (vt+0x7C) to call it, $s2 the monster: POSITION, WALL_SECTORS and the clip are the frame before's" }
AI_SCRIPT = { eu = 0x09AB4B68, type = "fn", doc = "(entity) a big monster's AI script: opcodes until one yields; opcode 5 sets ENTITY.FREEZE_GATE's low byte and enters (main, sub) mode 1 through ENTER_ACTION; nothing in main 5 or 6" }
SCRIPT_TICK = { eu = 0x09AD8278, type = "fn", doc = "(entity) from a species' AI step: counts ENTITY.SCRIPT_WAIT down, else runs AI_SCRIPT once ENTITY.SCRIPT_WAKE is set and clears it" }

# --- big-monster intel: effects, attacks, engine interface ---
EFFECT_SPAWN_AT = { eu = 0x09ACB610, type = "fn", doc = "effect spawn at a bone (entity, id, bone base, bone offset); wraps EFFECT_SPAWN" }
EFFECT_SPAWN_FRAMED = { eu = 0x09ACB9C8, type = "fn", doc = "effect spawn once the clip cursor is in a frame window (entity, frame lo, frame hi, id, bone, mode, slot)" }
