BROKEN = { offset = 0x774, type = "u16", doc = "big monsters: broken parts, bit per BREAK_ROW.BREAK_ID (BREAK_RECORD)" }

MODEL_SCALE = { offset = 0x060, type = "vec3", doc = "copy of the PMO's scale (Zinogre 608.3 each, human 90.5/105.3/51.6); an NPC's solid extent with NPC.FLAGS bit 2" }
