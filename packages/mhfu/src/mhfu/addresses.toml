DATA = { offset = 0x04, type = "ptr", doc = "the file's raw buffer; a big-monster PAC lands here before the overlay restructures it" }

[struct.SPECIES]
doc = "one SPECIES_TABLE row; fields past the stride are parallel tables at the same stride; map-wide, read only"
stride = 0x1D0
[struct.SPECIES.fields]
COOLDOWNS = { offset = 0x00, type = "ptr", doc = "cooldown and max-duration timer table" }
WEIGHTS = { offset = 0x04, type = "ptr", doc = "action selection weight table" }
