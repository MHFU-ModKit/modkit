[struct.ENTITY]
doc = "common entity layout of monsters, the player combat entity and village NPCs; field docs name a narrower user"
[struct.ENTITY.fields]
VTABLE = { offset = 0x000, type = "ptr", doc = "class vtable; identifies the species more reliably than SPECIES" }
RENDER_FLAGS = { offset = 0x004, type = "u32", doc = "engine output: bit 0x4 skips the draw (VISIBILITY_GATE sets it for a big monster out of section)" }
DRAW_NODE = { offset = 0x008, type = "ptr", doc = "engine output: shared draw node while in the view frustum this frame, else 0" }
ROTATION = { offset = 0x010, type = "f32[12]", doc = "3x4 orientation rows, rebuilt every frame from YAW: read only" }
SIZE_SCALE = { offset = 0x024, type = "f32", doc = "size multiplier; re-derived every frame, so resize through RENDER_SCALE and SIZE_RADIUS" }
TRANSLATION = { offset = 0x040, type = "vec3", doc = "transform translation row (w = 1.0 at +0x4C), copied from POSITION each frame" }
TRANSLATION_W = { offset = 0x04C, type = "f32", doc = "w of the translation row, 1.0 on a live transform" }
FRAME_COUNTER = { offset = 0x092, type = "u8", doc = "per-entity frame counter; stops while the AI tick is frozen" }
CLIP = { offset = 0x0B8, type = "ptr", doc = "slot-0 clip node of the playing animation (clip blocks at +0x80, 0x40 per slot)" }
CLIP_FLAGS = { offset = 0x0BC, type = "u16", doc = "slot-0 clip flags: bit 0 playing (cleared when the clip ends), bit 1 loop" }
JOINTS = { offset = 0x190, type = "ptr", doc = "live joint array the engine poses from (struct JOINT, stride 0x250)" }
SLOT_COUNT = { offset = 0x1A2, type = "u16", doc = "AI slot count on the small-monster path; big monsters ignore it" }
ACTION_TABLE = { offset = 0x1AC, type = "ptr", doc = "per-species table the vt[8] resolver maps an animation input through: probabilities for small monsters, clip pointers for big ones" }
SLOT_INPUTS = { offset = 0x1B8, type = "u16[3]", doc = "per-slot input cursors fed to the vt[8] resolver; zeroed by act_set" }
NEXT_OBJ = { offset = 0x1C4, type = "ptr", doc = "next entity on the engine's update list; splice clones in here" }
PREV_OBJ = { offset = 0x1C8, type = "ptr", doc = "previous entity on the engine's update list (not a pursue target)" }
PHASE = { offset = 0x1D5, type = "u8", doc = "per-action phase cursor (+0x1D5..+0x1D7), zeroed on each new (main, sub); handlers step it" }
ID = { offset = 0x1E4, type = "u8", doc = "entity id" }
CLASS = { offset = 0x1E9, type = "u8", doc = "class byte EFFECT_OWNER combines with ID" }
SPECIES = { offset = 0x1E8, type = "u8", doc = "species id (emId), indexes SPECIES_TABLE; 0x46 Popo, 0x45 Anteka, 0x4B Tigrex" }
YAW = { offset = 0x1F4, type = "u16", doc = "packed yaw, 0..0xFFFF = 0..2pi, atan2(dx, dz); the rotation control, write this not ROTATION" }
POSITION = { offset = 0x200, type = "vec3", doc = "world position the engine draws from; writing it moves the entity" }
RENDER_SCALE = { offset = 0x220, type = "vec3", doc = "per-axis render scale; sticks when written" }
SIZE_RADIUS = { offset = 0x270, type = "f32", doc = "cached size-derived radius; write it together with RENDER_SCALE" }
MAIN_STATE = { offset = 0x298, type = "u8", doc = "big monsters: behaviour main state written by act_set; with SUB_STATE it picks the move" }
SUB_STATE = { offset = 0x299, type = "u8", doc = "big monsters: behaviour sub state written by act_set" }
SECTION = { offset = 0x29A, type = "u16", doc = "section the engine places the entity in (AREA_INDEX encoding); visibility gate A, lags transitions" }
TARGET_ACQUIRED = { offset = 0x2A4, type = "u8", doc = "aggro-eval target-acquired flag; reads 0 even on an engaged native, not a combat signal" }
HP = { offset = 0x2E4, type = "u16", doc = "current HP" }
COMBAT_NODE = { offset = 0x2EC, type = "ptr", doc = "this entity's collision node (struct COLLISION_NODE); 0 means it cannot deal damage" }
TARGET = { offset = 0x2F4, type = "ptr", doc = "big monsters: resolved combat target (player or Felyne); flickers, so sample a histogram" }
TALKABLE = { offset = 0x2FE, type = "u8", doc = "village NPCs: 1 while this NPC shows the talk icon" }
STIMULUS_TAG = { offset = 0x322, type = "u16", doc = "stimulus type written by the damage handler; picks alert or flee responses" }
ANIM_INPUT = { offset = 0x324, type = "u16[3]", doc = "per-body-part animation input = executor action id + 0x3E8 + slot*0xC8" }
ANIM_MODE = { offset = 0x32C, type = "u16[3]", doc = "per-body-part animation mode" }
ANIM_SPEED = { offset = 0x334, type = "u16[3]", doc = "per-body-part playback speed each action installs with its clip; it tracks the action but is not an AI state" }
ATTACK_GATE = { offset = 0x33C, type = "u8", doc = "ATTACK_RESOLVER runs the full attack resolution only while this is 0" }
COMBAT_ENGAGED = { offset = 0x33D, type = "u8", doc = "set to 1 by the combat registrar together with COMBAT_NODE" }
COMBATANT_IDS = { offset = 0x33E, type = "u16[16]", doc = "player only: combatant ids registered against the player" }
COMBAT_LINK = { offset = 0x364, type = "u32", doc = "COMBAT_REGISTER stores COMBAT_NODE + 0x1C here" }
COMBATANT_COUNT = { offset = 0x398, type = "u8", doc = "player only: number of ids in COMBATANT_IDS (at most 16)" }
PENDING_DAMAGE = { offset = 0x3B8, type = "s16[8]", doc = "per-part pending damage the resolver totals into HP each frame" }
COMBAT_REGISTERED = { offset = 0x3F8, type = "u8", doc = "set to 1 by the combat registrar together with COMBAT_NODE" }
CONDITION_FLAGS = { offset = 0x410, type = "u32", doc = "AI condition flag word; bit 0x8 gates a stress-response branch" }
ACTION_BUDGET = { offset = 0x414, type = "u32", doc = "big monsters: action frame budget that budget-gated handlers count down; writable" }
HP_CAP = { offset = 0x41C, type = "u16", doc = "recoverable HP ceiling (the player's red bar); regen stops here" }
MAX_HP = { offset = 0x41E, type = "u16", doc = "maximum HP; damage and regen clamp to it" }
PREV_MAIN = { offset = 0x460, type = "u8", doc = "big monsters: main state before the last act_set" }
PREV_SUB = { offset = 0x461, type = "u8", doc = "big monsters: sub state before the last act_set" }
HITZONE_STATE = { offset = 0x481, type = "s8", doc = "big monsters: which SPECIES.HITZONE_STATES grid the damage math reads" }
FREEZE_GATE = { offset = 0x4B8, type = "u32", doc = "bits 0x100 and 0x10000 halt the AI tick; clear them after forcing an action" }
PURSUIT = { offset = 0x5D0, type = "vec3", doc = "pursuit vector toward the target, written with ENGAGE in one quad store" }
ENGAGE = { offset = 0x5DC, type = "f32", doc = "1.0 while the monster has noticed and pursues a target; rewritten every frame" }
AI_TIMER_A = { offset = 0x624, type = "u16", doc = "AI countdown timer read by the stress-response ladder" }
AI_TIMER_B = { offset = 0x626, type = "u16", doc = "second AI countdown timer read by the stress-response ladder" }
STRESS = { offset = 0x62E, type = "u16", doc = "stress counter clamped to 75..450" }
FLAGS = { offset = 0x638, type = "u32", doc = "flags: 0x8000 visibility gate B, 0x20 enraged, bit 0 swaps in ACTION_LIST_REMAP" }
ACTION_LIST = { offset = 0x640, type = "ptr", doc = "action-descriptor list the dispatcher walks; a big monster's is its overlay's table of 8-byte rows, byte 0 the action id" }
DETECT_RANGES = { offset = 0x64C, type = "f32[3]", doc = "detection ranges (1000, 2700, 5000 on a native); read on evaluate, never written, so zero sticks" }
DETECT_RANGES_B = { offset = 0x67C, type = "f32[3]", doc = "second detection-range triple with the same values and use as DETECT_RANGES" }
FLEE = { offset = 0x6D8, type = "u8", doc = "small monsters: 1 while fleeing; engine output, read only" }
HERD_RALLY = { offset = 0x1214, type = "vec3", doc = "small monsters: herd rally position set when the player attacks the herd" }
HERD_MEMBERS = { offset = 0x1220, type = "ptr[20]", doc = "small monsters: other entities in the same herd" }

[struct.MONSTER_VTABLE]
doc = "a species entity vtable (ENTITY.VTABLE): slot k at +8 + 4k, after the offset-to-top and typeinfo pair"
[struct.MONSTER_VTABLE.fields]
PICK_ACTION = { offset = 0x20, type = "ptr", doc = "vt[8] action picker, ACTION_PICKER on the small-monster-shaped species; a data word, so swapping it is JIT-safe" }
AI_STEP = { offset = 0x7C, type = "ptr", doc = "per-frame AI step (slot 29), about 30 dispatches a second" }
ENTER_ACTION = { offset = 0x88, type = "ptr", doc = "enter_action(entity, main, id, mode) (slot 32): provisions a behaviour pair and ends in ACT_SET" }

[struct.PLAYER]
doc = "player character struct at PLAYER_STRUCT, one of seven same-class slots; holds no stats"
size = 0x250
[struct.PLAYER.fields]
VTABLE = { offset = 0x000, type = "ptr", doc = "class vtable, PLAYER_STRUCT_VTABLE" }
POSITION = { offset = 0x080, type = "vec3", doc = "position in a local visual frame, not world coordinates" }
POSITION_W = { offset = 0x08C, type = "f32", doc = "homogeneous w of the position row (1.0)" }
ROTATION = { offset = 0x090, type = "f32[12]", doc = "3x4 rotation matrix" }

[struct.JOINT]
doc = "one entry of an entity's live joint array (ENTITY.JOINTS)"
size = 0x250
[struct.JOINT.fields]
POSITION = { offset = 0x100, type = "vec3", doc = "world position of this bone" }

[struct.COLLISION_WORLD]
doc = "collision world COLLISION_WORLD_PTR points at"
[struct.COLLISION_WORLD.fields]
LIST_HEAD = { offset = 0x502C, type = "ptr", doc = "head of the per-frame hit-test node list, linked through COLLISION_NODE.NEXT" }
NODE_COUNT = { offset = 0x5034, type = "u32", doc = "a count the clone driver logs as the node count; not verified" }

[struct.COLLISION_NODE]
doc = "node in the per-frame hit-test list; the engine rebuilds and reuses nodes every frame"
size = 0x110
[struct.COLLISION_NODE.fields]
NEXT = { offset = 0x04, type = "ptr", doc = "next node in the list" }
PREV = { offset = 0x08, type = "ptr", doc = "second list link; a node copy keeps it together with NEXT" }
STATE = { offset = 0x0E, type = "u8", doc = "must not be 0xFF for the node to register" }
ENTITY = { offset = 0x10, type = "ptr", doc = "owning entity" }
ID = { offset = 0x18, type = "u16", doc = "combatant id the hit-test matches; the engine may use it as a table index" }
REGISTER_ID = { offset = 0x1A, type = "u16", doc = "combatant id the registrar copies into the player's COMBATANT_IDS" }
POSITION = { offset = 0x40, type = "vec3", doc = "hit-test position (the owner's position)" }
PLAYER = { offset = 0x68, type = "ptr", doc = "the combatant this node is registered against (the player)" }

[struct.MONSTER_MANAGER]
doc = "big-monster manager singleton at MONSTER_MANAGER_SINGLETON"
[struct.MONSTER_MANAGER.fields]
PROCESSOR = { offset = 0x0C, type = "ptr", doc = "per-monster processor the per-frame drive calls; a data word, so swapping it is JIT-safe" }
FRAME_COUNTER = { offset = 0x30, type = "u32", doc = "incremented once per drive, i.e. once per frame" }
LANDING = { offset = 0x20, type = "vec3", doc = "where the hunter lands after an area change, copied from STAGE_EXIT.DEST" }
LANDING_YAW = { offset = 0x2C, type = "u16", doc = "the hunter's facing on landing, copied from STAGE_EXIT.YAW" }
EXIT = { offset = 0x4C, type = "ptr", doc = "the STAGE_EXIT an area change goes through; EXIT_CHECK rewrites it every frame" }
REQUESTS = { offset = 0x54, type = "u32", doc = "bit 0: change area through EXIT on this update (EXIT_CHECK sets it, HUNTER.EXITING with it)" }

[struct.QUEST]
doc = "Quest singleton at QUEST_SINGLETON"
size = 0x8A8
[struct.QUEST.fields]
TIMER = { offset = 0x10, type = "u32", doc = "quest time left in frames at 30 Hz; 90000 = 50 minutes" }
RECORDS = { offset = 0x50, type = "ptr", doc = "parsed quest data (struct QUEST_DATA)" }
GROUP_COUNT = { offset = 0x67C, type = "u32", doc = "number of big-monster target groups; the engine caps it at 2" }
TARGETS = { offset = 0x768, type = "QUEST_TARGET[2]", doc = "the big-monster target groups, filled at quest begin" }

[struct.QUEST_TARGET]
doc = "one big-monster target group in QUEST.TARGETS"
size = 0x2C
[struct.QUEST_TARGET.fields]
RECORD = { offset = 0x00, type = "ptr", doc = "the group's first monster record (struct QUEST_RECORD)" }
EM_ID = { offset = 0x14, type = "u32", doc = "emId of that record" }
MEMBER_FLAGS = { offset = 0x19, type = "u8[5]", doc = "one byte per member; meaning unknown, the framework writes 1 when it fills a group" }
COUNT = { offset = 0x1E, type = "u16", doc = "monsters in this group" }

[struct.QUEST_DATA]
doc = "parsed quest data buffer QUEST.RECORDS points at; list, record and header offsets are relative to it"
[struct.QUEST_DATA.fields]
LIST_A = { offset = 0x14, type = "u32", doc = "offset of the big-monster list (QUEST_LIST_NODE rows, ended by HEADER == 0)" }
SCRATCH_RECORD = { offset = 0x1C00, type = "bytes", doc = "framework-owned: 0x40-byte fabricated monster record in the unused tail" }
SCRATCH_HEADER = { offset = 0x1C40, type = "bytes", doc = "framework-owned: 0x10-byte fabricated monster header in the unused tail" }

[struct.QUEST_LIST_NODE]
doc = "one row of the big-monster list in QUEST_DATA"
size = 0x10
[struct.QUEST_LIST_NODE.fields]
FLAG = { offset = 0x00, type = "u32", doc = "1 in a live node" }
RESERVED = { offset = 0x04, type = "u32", doc = "0 in a live node" }
HEADER = { offset = 0x08, type = "u32", doc = "monster-header offset from QUEST_DATA; 0 ends the list" }
RECORD = { offset = 0x0C, type = "u32", doc = "monster-record offset from QUEST_DATA" }

[struct.QUEST_MONSTER_HEADER]
doc = "monster header in QUEST_DATA a QUEST_LIST_NODE.HEADER points at"
size = 0x10
[struct.QUEST_MONSTER_HEADER.fields]
EM_ID = { offset = 0x00, type = "u16", doc = "emId, the same as the record's; the u16 after it is 0" }
FILL = { offset = 0x04, type = "u8[12]", doc = "0xFF in every byte" }

[struct.QUEST_RECORD]
doc = "one monster record in QUEST_DATA; only EM_ID and the spawn position are species-neutral"
size = 0x40
[struct.QUEST_RECORD.fields]
EM_ID = { offset = 0x00, type = "u16", doc = "emId in the low byte (the ENTITY.SPECIES namespace)" }
