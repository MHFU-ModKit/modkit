ATTACK_SPAWNERS = { eu = 0x09B63000, type = "code", doc = "start of game_task's attack-node constructors, one per species (TIGREX_ATTACK_SPAWN among them), (?, entity, attack id)" }
ATTACK_SPAWNERS_END = { eu = 0x09B66B00, type = "code", doc = "end of the ATTACK_SPAWNERS run" }
REACTION_CHECK = { eu = 0x09AC7908, type = "fn", doc = "(entity, out): applies PENDING_DAMAGE while HIT_PENDING and returns the reaction a species AI step enters: 0 none, 2 dead, 12 flinch, 14 hit only, 15/16 damage types 26..30; when the cut counter (FLINCH_PARTS[8]) reaches 0 it asks OBJ_VTABLE.CUT_GATE, and a refusal puts the counter back to 1" }
RAGE_START = { eu = 0x09AD23D0, type = "fn", doc = "(entity) the rage start: FLAGS |= 0x20, RAGE_TIMER from the species rage row, anim speed, the attack scalar +0x380 and HITZONE_STATE 1; MONSTER_STEP calls it while FLAGS has 0x400 and the monster is not in main 4, +0x523 or +0x4C1 & 8 (else it stays pending), and the AI script roars (3,27)" }
RAGE_END = { eu = 0x09AD87E8, type = "fn", doc = "(entity) the rage end: MONSTER_STEP calls it when RAGE_TIMER reaches 0; restores the scalars and zeroes ANGER; plays nothing" }
ANGER_ADD = { eu = 0x09AD37F8, type = "fn", doc = "(entity, hp taken) from the damage resolver on every hit, skipped while enraged: ANGER += the hit times the species rate for the HP bracket; at ANGER_THRESHOLD it sets FLAGS 0x400" }
EM75_REACTIONS = { eu = 0x09D62B00, type = "ptr[19]", doc = "em75 AI step's jump table over REACTION_CHECK codes; each case enters vt+0x88(entity, 4, 5 or 6, sub, mode 2); code 11, the tail cut, enters (4,4)" }
EM75_ATTACK_NODE_INIT = { eu = 0x09D4B318, type = "fn", doc = "(node, entity, attack id): fills the ATTACK_NODE, links it at COLLISION_WORLD.LIST_HEAD, clears the owner's COMBAT_ENGAGED and COMBAT_REGISTERED" }
SET_COMBAT_MODE = { eu = 0x09AC92B0, type = "fn", doc = "(entity, mode, frames): ENTITY.COMBAT_MODE = mode; 0 also forgets ENTITY.AWARE. The AI script sets 1 in the hub after the roar; a hit sets it too" }
AWARENESS_ADD = { eu = 0x09AD29F8, type = "fn", doc = "(entity, amount, cap, hunter index): adds to ENTITY.AWARENESS; at 9000, with the hunter in the monster's section, sets its ENTITY.AWARE bit (the notice) and refills AWARE_TIMERS with SPECIES.AWARE_TIME" }
AWARE_MEMORY = { eu = 0x09AC9B08, type = "fn", doc = "(entity) per hunter: an ENTITY.SENSED bit keeps the AWARE bit and refills its AWARE_TIMERS with SPECIES.AWARE_TIME; else the timer counts down and the bit clears at 0" }
EYE_UPDATE = { eu = 0x09A686C0, type = "fn", doc = "(hunter) each frame: HUNTER.EYE = 1 (the yellow eye beside the name) when a big monster in the hunter's section, alive, FLAGS & 0x8, has its AWARE bit and COMBAT_MODE 1; HUNTER.THREAT = that monster" }
FLINCH_RESET = { eu = 0x09AD3B10, type = "fn", doc = "(entity, part): an enabled FLINCH_PART's COUNTER = SPECIES.FLINCH_LIMITS[part] scaled by the quest's rank; REACTION_CHECK calls it as the part flinches" }
PART_BREAK = { eu = 0x09AD4940, type = "fn", doc = "(entity, flinched parts) from REACTION_CHECK: a part whose FLINCH_PART.COUNT reaches its BREAK_ROW's breaks: effect, BREAK_RECORD, HITZONE_STATE" }
BREAK_RECORD = { eu = 0x09AD7F48, type = "fn", doc = "(entity, break id): sets bit id of ENTITY.BROKEN and of the quest's per-species record" }
BREAK_TABLE = { eu = 0x09BCE8E0, type = "BREAK_ROW[62]", doc = "part breaks of every species, a zero row last (game_task overlay)" }

