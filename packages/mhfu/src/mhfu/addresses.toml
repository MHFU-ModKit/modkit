[struct.FLINCH_PART]
doc = "one part's flinch state (ENTITY.FLINCH_PARTS)"
size = 0x8
[struct.FLINCH_PART.fields]
ENABLED = { offset = 0x0, type = "u8", doc = "0: FLINCH_RESET leaves the part alone" }
COUNTER = { offset = 0x4, type = "s16", doc = "counted down by the part's damage; at 0 or below the part flinches and FLINCH_RESET refills it" }
COUNT = { offset = 0x6, type = "u8", doc = "flinches so far, at most 15; a BREAK_ROW.COUNT matching it breaks the part" }

[struct.BREAK_ROW]
doc = "one part break (BREAK_TABLE): a part of a species breaks at its COUNT-th flinch"
size = 0x20
[struct.BREAK_ROW.fields]
SPECIES = { offset = 0x0, type = "u8", doc = "species, compared by family (0x4B the Tigrex)" }
PART = { offset = 0x1, type = "u8", doc = "the flinching part" }
COUNT = { offset = 0x2, type = "u8", doc = "FLINCH_PART.COUNT that breaks it" }
HITZONE_STATE = { offset = 0x3, type = "u8", doc = "1: the break sets ENTITY.HITZONE_STATE = 1" }
BONE = { offset = 0x4, type = "s16", doc = "bone of the break effect; -1 none" }
BREAK_ID = { offset = 0x6, type = "u16", doc = "bit set in ENTITY.BROKEN; 0xFFFF none (em75: parts 4 and 6 at their first flinch bit 1, part 0 at its second bit 2)" }

[struct.MONSTER_EVENT]
doc = "one record of the framework's monster events (monster_events.h mhfu_monster_event_t)"
size = 0x14
[struct.MONSTER_EVENT.fields]
ENTITY = { offset = 0x00, type = "ptr", doc = "the monster" }
FRAME = { offset = 0x04, type = "u32", doc = "its MONSTER_WATCH.FRAMES the change was seen in: noticed the engine's own AI frame, the others the one after" }
USEC = { offset = 0x08, type = "u32", doc = "the emulated clock then (sceKernelGetSystemTimeLow)" }
KIND = { offset = 0x0C, type = "u8", doc = "1 noticed, 2 combat entered, 3 combat left, 4 flinch, 5 part broken, 6 tail cut, 7 enraged, 8 calmed" }
PART = { offset = 0x0D, type = "u8", doc = "flinch, part broken: the lowest part in ENTITY.FLINCH_MASK; else 0xFF" }
MAIN = { offset = 0x0E, type = "u8", doc = "ENTITY.MAIN_STATE then: for a flinch, the reaction the engine entered" }
SUB = { offset = 0x0F, type = "u8", doc = "ENTITY.SUB_STATE then" }
DATA = { offset = 0x10, type = "u16", doc = "flinch: FLINCH_MASK; part broken: the new BROKEN bits; noticed: AWARE; combat: 1 entered, 0 left; tail cut: SEVER_COUNT" }

[struct.MONSTER_WATCH]
doc = "what the monster-event step compares against, per monster"
size = 0x10
[struct.MONSTER_WATCH.fields]
ENTITY = { offset = 0x0, type = "ptr", doc = "the monster; 0 = free" }
FRAMES = { offset = 0x4, type = "u32", doc = "its AI frames the step saw" }
AWARE = { offset = 0x8, type = "u8", doc = "ENTITY.AWARE last frame" }
COMBAT = { offset = 0x9, type = "u8", doc = "1 when the player's yellow eye was on for it last frame" }
SEVERED = { offset = 0xA, type = "u8", doc = "ENTITY.SEVERED bit 0 last frame" }
ENRAGED = { offset = 0xB, type = "u8", doc = "ENTITY.FLAGS bit 0x20 last frame" }
BROKEN = { offset = 0xC, type = "u16", doc = "ENTITY.BROKEN last frame" }
EDGES = { offset = 0xE, type = "u16", doc = "bit KIND: what the last frame raised" }

[struct.MONSTER_EVENTS]
doc = "the framework's monster-event block in partition memory (monster_events.cpp): the ring the step writes and the registry poll raises"
size = 0x2B0
[struct.MONSTER_EVENTS.fields]
MAGIC = { offset = 0x00, type = "u32", doc = "0x45564E54 (EVNT)" }
HEAD = { offset = 0x04, type = "u32", doc = "records written; RING[HEAD % 32] is the next" }
TAIL = { offset = 0x08, type = "u32", doc = "records raised" }
DROPPED = { offset = 0x0C, type = "u32", doc = "records lost to a full ring" }
WATCH = { offset = 0x10, type = "MONSTER_WATCH[2]", doc = "the monsters followed" }
RING = { offset = 0x30, type = "MONSTER_EVENT[32]", doc = "the records" }

[struct.EM_RULE]
doc = "one brain rule in em_vhook's config block (em_vhook.cpp cfg_rule_t): a trigger, its conditions, what it plays and what it changes, evaluated each AI frame in C"
size = 0x40
[struct.EM_RULE.fields]
FROM_MASK = { offset = 0x00, type = "u8", doc = "bit k: may fire while the live pair's main is k; 0 with FROM_MOVE 0: no pair gate" }
FROM_SUB = { offset = 0x01, type = "u8", doc = "with FROM_MASK: the exact sub, or 0xFE any" }
TO_MAIN = { offset = 0x02, type = "u8", doc = "the pair entered when PLAY_MOVE is 0" }
TO_SUB = { offset = 0x03, type = "u8", doc = "with TO_MAIN" }
MODE = { offset = 0x04, type = "u8", doc = "ENTER_ACTION mode for TO_MAIN, TO_SUB" }
FLAGS = { offset = 0x05, type = "u8", doc = "1 only while the hunter recedes, 2 only while they close, 4 plays nothing: applies its EFFECTS and the scan goes on" }
FROM_MOVE = { offset = 0x06, type = "u8", doc = "own move slot + 1 that must be playing (its AI frames the dwell); 0 none" }
PLAY_MOVE = { offset = 0x07, type = "u8", doc = "own move slot + 1 played instead of entering TO_MAIN, TO_SUB; 0 none" }
MIN_FRAMES = { offset = 0x08, type = "u32", doc = "AI frames the pair (or FROM_MOVE) must have stood" }
D2_LO = { offset = 0x0C, type = "u32", doc = "the hunter's XZ distance squared, f32 bits: at least this" }
D2_HI = { offset = 0x10, type = "u32", doc = "...and under this" }
LEFT = { offset = 0x14, type = "u32", doc = "fires left; 0 off, 0xFFFFFFFF standing" }
FIRED = { offset = 0x18, type = "u32", doc = "fires so far" }
LAST_FIRE = { offset = 0x1C, type = "u32", doc = "the block's AI tick of the last fire" }
COOLDOWN = { offset = 0x20, type = "u32", doc = "AI ticks between two fires" }
ON = { offset = 0x24, type = "u8", doc = "the monster event that fires it (MONSTER_EVENT.KIND), in the AI frame it is seen; 4, the flinch, replaces the host's reaction; 0 none" }
PART = { offset = 0x25, type = "u8", doc = "ON 4 or 5: only a flinch or break of this part (ENTITY.FLINCH_MASK bit); 0xFF any" }
FORCE = { offset = 0x26, type = "u8", doc = "1: PLAY_MOVE starts while the monster's notice runs (MOVE.FORCE)" }
SIGNAL = { offset = 0x27, type = "u8", doc = "a Lua signal (EM_BOARD.SIGNALS index + 1) that fires it in the AI frame it is seen, like ON; 0 none" }
CONDS = { offset = 0x28, type = "EM_OP[4]", doc = "conditions that must all hold (OP an EM_COND, 0 none), CHANCE rolled last" }
EFFECTS = { offset = 0x38, type = "EM_OP[2]", doc = "what it changes when it fires (OP an EM_EFFECT, 0 none)" }

[struct.EM_OP]
doc = "one condition or effect of a brain rule (EM_RULE.CONDS, EM_RULE.EFFECTS)"
size = 0x4
[struct.EM_OP.fields]
OP = { offset = 0x0, type = "u8", doc = "EM_COND or EM_EFFECT index + 1; 0 none" }
ARG = { offset = 0x1, type = "u8", doc = "a part (broken), a side mask (side: 1 front, 2 left, 4 right, 8 behind) or an EM_BOARD.VARS index" }
VALUE = { offset = 0x2, type = "s16", doc = "a percent (hp_*, chance) or a number (var_*)" }

[struct.EM_BOARD]
doc = "em_vhook's blackboard after its config block: what rules and Lua share for the wrapped species' monster; a new monster resets it"
size = 0x40
[struct.EM_BOARD.fields]
VARS = { offset = 0x00, type = "s16[16]", doc = "counters and flags, by the index the moves module's `vars` names; var_add saturates" }
SIGNALS = { offset = 0x20, type = "u8[16]", doc = "1: Lua raised the signal (mhfu_em_signal) since the brain's last AI frame, which takes it" }
BROKEN = { offset = 0x30, type = "u8", doc = "bit k: part k broke on this monster (its part_broken events)" }
RNG = { offset = 0x34, type = "u32", doc = "xorshift32 state for CHANCE" }
ENTITY = { offset = 0x38, type = "ptr", doc = "the monster it belongs to" }

[enum.EM_COND]
doc = "a brain rule's condition, EM_OP.OP - 1: hp_at_least/hp_below HP percent of MAX_HP against VALUE; broken/not_broken part ARG in EM_BOARD.BROKEN; enraged/calm ENTITY.FLAGS 0x20; side the hunter in a sector of the monster's facing in mask ARG (90 degrees each, left the monster's own); chance VALUE percent; var_* EM_BOARD.VARS[ARG] against VALUE"
names = ["hp_at_least", "hp_below", "broken", "not_broken", "enraged", "calm", "side", "chance", "var_at_least", "var_below", "var_equal"]

[enum.EM_EFFECT]
doc = "what a brain rule changes when it fires, EM_OP.OP - 1: var_add adds VALUE to EM_BOARD.VARS[ARG], var_set sets it; enrage sets FLAGS 0x400 unless enraged, calm sets RAGE_TIMER 1 while enraged"
names = ["var_add", "var_set", "enrage", "calm"]

[struct.EM_CFG]
doc = "em_vhook's config block in partition memory, which its stubs read by the offsets in em_vhook_stubs.h; listed here: the rules"
size = 0xCE0
[struct.EM_CFG.fields]
RULES = { offset = 0xE0, type = "EM_RULE[48]", doc = "the brain's rules: their count is the capacity a port's manifest and mhfu_port.lua read" }

[enum.MONSTER_EVENT_KIND]
doc = "the framework's monster events (MONSTER_EVENT.KIND), a manifest rule's on"
names = ["noticed", "combat_entered", "combat_left", "flinch", "part_broken", "tail_cut", "enraged", "calmed"]

[enum.MOVE_END]
doc = "MOVE_STATE.END, why the move player's move ended: its clip ended (the carrier handed off); the clip or LENGTH ended and the back pair was entered; the pair changed under it; stopped; replaced; the enter-action did not land the carrier; another dispatch replaced the clip; a wall ahead; a class-2 wall (the stuck pair entered); a reaction mhfu_move_react replaces started its move"
names = ["clip", "back", "pair", "stopped", "replaced", "refused", "lost", "wall", "stuck", "reaction"]
