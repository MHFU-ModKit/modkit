OBJECTIVE = { offset = 0x058, type = "bytes", doc = "objective" }
FAIL_CONDITION = { offset = 0x076, type = "bytes", doc = "fail condition" }
REWARD = { offset = 0x100, type = "bytes", doc = "reward and fail line" }
DESCRIPTION = { offset = 0x1A8, type = "bytes", doc = "description" }
MONSTERS = { offset = 0x3F8, type = "bytes", doc = "monster names, newline-separated" }
CLIENT = { offset = 0x4A0, type = "bytes", doc = "client" }

[struct.NPC_MENU]
doc = "option-menu state at NPC_MENU_STATE, shared by every NPC menu (shop, smith, recruiter)"
[struct.NPC_MENU.fields]
PLAYER = { offset = 0x00, type = "ptr", doc = "the player entity" }
