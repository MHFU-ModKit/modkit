# MHFU runtime addresses and struct layouts, EU release (ULES01213).
#
# The single source for every game address the modkit uses. Python reads this file; the C header
# and the Lua table are generated from it with `python -m mhfu.addresses c` / `lua`.
#
#   [address]
#   NAME = { eu = <absolute address>, type = "<type>", doc = "<one line>" }
#
#   [struct.NAME]
#   doc = "<one line>"
#   size = <bytes>                      # optional, only when known
#   [struct.NAME.fields]
#   NAME = { offset = <offset>, type = "<type>", doc = "<one line>" }
#
#   [set]                               # addresses named together
#   NAME = { of = ["<address name>", ...], doc = "<one line>" }
#
# Types: u8 u16 u32 s8 s16 s32 f32 vec3 ptr vtable fn code bytes, or a struct's name, each
# optionally followed by [count] for an array, which also generates NAME_COUNT. fn is a function
# entry, code any other instruction address.
# A set is a frozenset in Python, an initializer and NAME_COUNT in C, and member = address in Lua.
# Names are UPPER_SNAKE_CASE; an address and a value appear once.

[address]
