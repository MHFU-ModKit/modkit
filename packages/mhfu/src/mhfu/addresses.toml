SCENE_OBJECT = { eu = 0x08A8C6E0, type = "ptr", doc = "scene-object pointer; tells sub-screens apart where SCREEN_STATE is shared (the real screen oracle)" }
SCREEN_STATE = { eu = 0x08A8CA48, type = "u8", doc = "screen-state id: 1 menu or zone load, 4 title, 6 cutscene, 17 in-area, 113 village with a quest under contract; 1 and 4 are the JIT-cold window" }
MAP_SUBSECTION = { eu = 0x08A8DE4C, type = "u8", doc = "sub-area byte; collides across sections and is scratch in the hall, so use AREA_INDEX" }
SCREEN_STATE_MIRROR = { eu = 0x08ACCA48, type = "u8", doc = "mirror of SCREEN_STATE (+0x40000), lags it by 50-100 ms" }
MAP_SUBSECTION_MIRROR = { eu = 0x08ACDE4C, type = "u8", doc = "mirror of MAP_SUBSECTION (+0x40000)" }
AREA_INDEX = { eu = 0x08B0C7DC, type = "u16", doc = "visible map-section index, equal to the stage number; ENTITY.SECTION uses the same encoding" }
INTERSECTING_EXIT = { eu = 0x088C72B0, type = "fn", doc = "StageManager::intersecting_exit(manager, vec3*): the STAGE_EXIT whose trigger holds the point, else 0" }
EXIT_CHECK = { eu = 0x09A631A8, type = "fn", doc = "game_task: the player's per-frame exit test; stores INTERSECTING_EXIT(ENTITY.POSITION) in MONSTER_MANAGER.EXIT, every frame" }
