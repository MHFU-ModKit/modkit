[project]
name = "modkit-ci"
version = "0.1.0"
description = "The repo's CI tooling: module registry, affected units, commit and API checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["griffelib>=2.4.1", "conventional-pre-commit>=4.5.0"]
classifiers = ["Private :: Do Not Upload", "Typing :: Typed"]

[project.scripts]
modkit-ci = "modkit_ci.cli:main"

[tool.coverage.report]
fail_under = 0

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
