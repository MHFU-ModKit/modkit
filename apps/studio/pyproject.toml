[project]
name = "mhfu-studio"
version = "0.1.0"
description = "Author MHFU mods offline: ported monsters and map edits, in one app."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "mhp-formats",
    "mhfu",
    "mhfu-port",
    "numpy>=2",
    "moderngl>=5.12",
    "pyside6-essentials>=6.11",
    "qtawesome>=1.4",
    "pillow>=11",
    "tomli-w>=1.2",
    "NodeGraphQt>=0.6.44",
    # Qt.py 2 pulls types-pyside6, whose stubs shadow PySide6's own and break strict mypy
    "Qt.py>=1.4.8,<2",
    # NodeGraphQt imports distutils, gone in 3.12; setuptools supplies it
    "setuptools>=70; python_full_version >= '3.12'",
]
classifiers = ["Typing :: Typed"]

[project.scripts]
studio = "mhfu_studio.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
