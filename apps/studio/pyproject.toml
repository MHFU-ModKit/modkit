[project]
name = "mhfu-studio"
version = "0.1.0"
description = "Author MHFU mods offline: ported monsters and map edits, in one app."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "mhp-formats",
    "mhfu",
    "mhfu-port",
    "numpy>=2",
    "moderngl>=5.12",
    "pyside6-essentials>=6.11",
    "qtawesome>=1.4",
    "pillow>=11",
    "tomli-w>=1.2",
]
classifiers = ["Typing :: Typed"]

[project.scripts]
studio = "mhfu_studio.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
