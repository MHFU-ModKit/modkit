[project]
name = "mhfu-blender"
version = "0.1.0"
description = "Blender extension: import MHFU monster PACs, edit them, export them and push them into the running game."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["mhp-formats", "mhfu-port", "mhfu"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
