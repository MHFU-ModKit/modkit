name: PRX

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: prx-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: affected
        uses: ./.github/actions/affected
      - name: Build and check the PRX
        if: steps.affected.outputs.all == 'true' || contains(fromJSON(steps.affected.outputs.modules), 'framework')
        run: make -C framework
