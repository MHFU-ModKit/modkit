name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          sync-args: --no-group qt
      - id: affected
        uses: ./.github/actions/affected
      - name: coverage floors
        if: github.event_name == 'pull_request' && matrix.python == '3.11'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-group qt modkit-ci coverage --base "$BASE"
      # Mesa for the studio's GL tests; X11 headers because glcontext has no wheel for 3.14
      - name: system libraries
        if: steps.affected.outputs.units != '[]'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libx11-dev
      # the studio's Qt tests run in qt.yml; here they skip
      - name: tests
        if: steps.affected.outputs.units != '[]'
        env:
          UNITS: ${{ steps.affected.outputs.units }}
          COV: ${{ matrix.python == '3.11' && '--cov' || '' }}
        run: |
          # shellcheck disable=SC2046,SC2086
          uv run --no-group qt modkit-ci test $(jq -r 'join(" ")' <<<"$UNITS") $COV --no-qt
