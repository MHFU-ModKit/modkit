name: Lua

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: lua-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lua:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        # no Qt libraries on the runner: pytest-qt would fail to load
        with:
          sync-args: --no-group qt
      - id: affected
        uses: ./.github/actions/affected
      - uses: ./.github/actions/luals
        if: ${{ steps.affected.outputs.all == 'true' || contains(fromJSON(steps.affected.outputs.modules), 'framework') }}
      - name: LuaLS check
        if: ${{ steps.affected.outputs.all == 'true' || contains(fromJSON(steps.affected.outputs.modules), 'framework') }}
        run: uv run modkit-ci luals check
      - name: Lua API model against the registration parser
        if: ${{ steps.affected.outputs.all == 'true' || contains(fromJSON(steps.affected.outputs.modules), 'framework') }}
        run: uv run pytest packages/modkit-ci/tests/test_api_lua.py packages/modkit-ci/tests/test_luals.py -q
