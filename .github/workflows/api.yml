name: API

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: ~/.cache/modkit-ci/luals
          key: luals-${{ hashFiles('packages/modkit-ci/src/modkit_ci/luals.py') }}
      - run: uv run modkit-ci api --base "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
