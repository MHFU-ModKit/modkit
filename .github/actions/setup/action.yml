name: setup
description: uv with its cache, and the locked workspace

inputs:
  python-version:
    description: Python for the environment ("" keeps the repo's pin)
    default: ""
  sync-args:
    description: Extra arguments to uv sync
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    # later `uv run`s would sync the default groups back in (qt among them)
    - run: |
        uv sync --locked ${{ inputs.sync-args }}
        echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
      shell: bash
