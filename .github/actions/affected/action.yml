name: affected
description: The modules and test units a change touches (needs the setup action and full history)

outputs:
  all:
    description: true when everything runs
    value: ${{ steps.affected.outputs.all }}
  modules:
    description: JSON list of affected module names
    value: ${{ steps.affected.outputs.modules }}
  units:
    description: JSON list of affected test unit names
    value: ${{ steps.affected.outputs.units }}

runs:
  using: composite
  steps:
    - id: affected
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          uv run modkit-ci affected --base "$BASE" --output github
        else
          uv run modkit-ci affected --all --output github
        fi
