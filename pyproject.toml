# Workspace root, not a package: every package under packages/ and apps/ is a member.

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4", "lupa>=2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-p", "pytester"]
