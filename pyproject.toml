# Workspace root, not a package: every package under packages/ and apps/ is a member.

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pre-commit>=4",
    "mypy>=1.18",
    "types-psutil",
    "lupa>=2",
    "mhp-formats[iso]",
    "unicorn>=2.1.4",
]
# the studio's Qt tests; CI leaves it out (no display, no Qt system libraries there)
qt = ["pytest-qt>=4.5"]

[tool.uv]
default-groups = ["dev", "qt"]

[tool.uv.sources]
mhp-formats = { workspace = true }
mhfu = { workspace = true }
mhfu-port = { workspace = true }
ppsspp-debug = { workspace = true }
mhfu-studio = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "framework"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-p", "pytester"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.11"
files = [
    "packages/ppsspp-debug/src",
    "packages/mhp-formats/src",
    "packages/mhfu/src",
    "packages/mhfu-port/src",
    "apps/studio/src",
]

[[tool.mypy.overrides]]
module = ["mhef.*", "pycdlib.*", "elftools.*", "qtawesome.*"]
ignore_missing_imports = true
