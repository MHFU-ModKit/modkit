version = 1

# Default for every file without its own SPDX header; GPL-3.0-or-later files carry one.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 sp00ktober"
SPDX-License-Identifier = "MIT"

# patches to PPSSPP carry its licence; the last matching annotation wins
[[annotations]]
path = "ppsspp/patches/**"
SPDX-FileCopyrightText = ["2026 sp00ktober", "PPSSPP Project"]
SPDX-License-Identifier = "GPL-2.0-or-later"

# the file-format library contains code derived from mhff, and the porter, the studio and the
# Blender extension are built on it; their sources also carry SPDX headers
[[annotations]]
path = ["packages/mhp-formats/**", "packages/mhfu-port/**", "apps/studio/**", "apps/blender/**"]
SPDX-FileCopyrightText = "2026 sp00ktober"
SPDX-License-Identifier = "GPL-3.0-or-later"
