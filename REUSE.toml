version = 1

# Default for every file without its own SPDX header; GPL-3.0-or-later files carry one.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 sp00ktober"
SPDX-License-Identifier = "MIT"

# patches to PPSSPP carry its licence; the last matching annotation wins
[[annotations]]
path = "ppsspp/patches/**"
SPDX-FileCopyrightText = ["2026 sp00ktober", "PPSSPP Project"]
SPDX-License-Identifier = "GPL-2.0-or-later"

# the file-format library contains code derived from mhff, and the porter, the studio and the
# Blender extension are built on it; their sources also carry SPDX headers
[[annotations]]
path = ["packages/mhp-formats/**", "packages/mhfu-port/**", "apps/studio/**", "apps/blender/**"]
SPDX-FileCopyrightText = "2026 sp00ktober"
SPDX-License-Identifier = "GPL-3.0-or-later"

# PSPSDK's linkfile.prx, three lines changed
[[annotations]]
path = "framework/prx.lds"
SPDX-FileCopyrightText = [
    "2005 adresd",
    "2005 Marcus R. Brown",
    "2005 James Forshaw",
    "2005 John Kelley",
    "2005 Jesper Svennevid",
    "2026 sp00ktober",
]
SPDX-License-Identifier = "BSD-3-Clause"

# TLSF 3.1, github.com/mattconte/tlsf at deff9ab509341f264addbd3c8ada533678591905, unchanged
[[annotations]]
path = "framework/third_party/tlsf/**"
SPDX-FileCopyrightText = "2006-2016 Matthew Conte"
SPDX-License-Identifier = "BSD-3-Clause"
