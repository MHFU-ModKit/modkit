[[component]]
name = "libgcc"
source = "https://gcc.gnu.org/, soft-float helpers (fp-bit.c, libgcc2.c)"
spdx = "GPL-3.0-or-later WITH GCC-exception-3.1"
text = false
libs = ["gcc"]
copyright = ["Copyright (C) Free Software Foundation, Inc."]
notice = """
Covered by the GCC Runtime Library Exception 3.1: the combined work may be propagated under
terms of your choice.
"""

[[component]]
name = "pthread-embedded (libpthread, libpthreadglue)"
source = "https://github.com/pspdev/pthread-embedded, COPYING"
spdx = "LGPL-2.1-only"
text = false
libs = ["pthread", "pthreadglue"]
copyright = ["Copyright (C) 2001, 2006 Ross P. Johnson", "Copyright (C) 2008 Jason Schmidlapp"]
notice = """
On the link line, but the linker pulls no member of it: the PRX's symbol table holds no pte_ or
pthread_ symbol. A build that pulls one carries LGPL-2.1 code and needs its text and a relink offer.
"""
