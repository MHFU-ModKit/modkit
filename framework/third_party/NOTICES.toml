# Third-party code the PRXs carry. `modkit-ci bundle framework` renders it into the zip's
# THIRD_PARTY_NOTICES.txt and ships LICENSES/<spdx>.txt for every component with `text = true`.
# `libs` names what framework/Makefile.psp links with -l (or $(PSPSDK)/lib/<name>.o), `dirs` a
# directory of framework/third_party. Copyright lines are read from the sources named in `source`.

[[component]]
name = "Lua 5.4.6"
source = "https://www.lua.org/ (pspdev package lua54 builds it)"
spdx = "MIT"
text = true
libs = ["lua"]
copyright = ["Copyright (C) 1994-2023 Lua.org, PUC-Rio."]

[[component]]
name = "TLSF 3.1"
source = "https://github.com/mattconte/tlsf, framework/third_party/tlsf"
spdx = "BSD-3-Clause"
text = true
dirs = ["tlsf"]
copyright = ["Copyright (c) 2006-2016, Matthew Conte"]

[[component]]
name = "PSPSDK (libpspsdk, libpspuser, libpspusb, libpspnet, libcglue, prxexports)"
source = "https://github.com/pspdev/pspsdk, LICENSE and the source headers"
spdx = "BSD-3-Clause"
text = true
libs = ["pspsdk", "pspuser", "pspusb", "pspnet", "pspnet_apctl", "pspkernel", "cglue", "prxexports"]
copyright = [
    "Copyright (c) 2005 adresd",
    "Copyright (c) 2005 Marcus R. Brown",
    "Copyright (c) 2005 James Forshaw",
    "Copyright (c) 2005 John Kelley",
    "Copyright (c) 2005 Jesper Svennevid",
    "Copyright (c) 2005 Jim Paris",
    "Copyright (c) 2005 Florin Sasu",
    "Copyright (c) 2006 Rafael Cabezas",
    "Copyright (c) 2007 dot_blank",
    "Copyright (c) 2007 Alexander Berl",
    "Copyright (c) 2007 Iaroslav Gaponenko",
    "Copyright (c) 2008 David Perry",
    "Copyright (c) 2008 moonlight",
    "Copyright (c) 2021-2023 Francisco Javier Trujillo Mata",
    "Copyright (c) 2023 Ivy Bowling",
]

